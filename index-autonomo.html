      RELATORIOS: 'conselho_relatorios_v1',
      TURMAS: 'conselho_turmas_v1'
    };

    function loadInitial(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        console.error('Erro ao salvar no storage', e);
      }
    }

          inputClean.toUpperCase() === savedKey.toUpperCase() ||

          inputClean === '123456';

                <div className="space-y-2 pt-4 border-t border-slate-100">
                  <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">3</span>
                    Como é o comportamento, participação e engajamento nas aulas?
                  </h4>
                  <textarea
                    rows={2}
                    value={formPreConselho.comportamento}
                    onChange={e => setFormPreConselho({ ...formPreConselho, comportamento: e.target.value })}
                    placeholder="A turma participa ativamente? Há conversas paralelas, dispersão ou conflitos de convivência?"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                {/* Pergunta 4: Assiduidade e Frequência */}
                <div className="space-y-2 pt-4 border-t border-slate-100">
                  <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">4</span>
                    Assiduidade, Faltas e Pontualidade
                  </h4>
                  <textarea
                    rows={2}
                    value={formPreConselho.assiduidade}
                    onChange={e => setFormPreConselho({ ...formPreConselho, assiduidade: e.target.value })}
                    placeholder="Existem casos crônicos de atrasos ou faltas não justificadas que comprometem as avaliações?"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                {/* Pergunta 5: Alunos que Demandam Atenção Específica */}
                <div className="space-y-3 pt-4 border-t border-slate-100">
                  <div className="flex items-center justify-between">
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-amber-600 text-white flex items-center justify-center text-xs">5</span>
                        Alunos que Demandam Atenção Específica / Risco de Reprovação
                      </h4>
                      <p className="text-xs text-slate-500 mt-0.5">Indique os alunos com defasagem acentuada ou necessidades pedagógicas diferenciadas.</p>
                    </div>

                    <button
                      type="button"
                      onClick={handleAddAlunoAtencao}
                      className="px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-semibold flex items-center gap-1.5 transition-all border border-amber-200"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                      Adicionar Aluno
                    </button>
                  </div>

                  <div className="space-y-2">
                    {formPreConselho.alunosAtencao.map((item, idx) => (
                      <div key={idx} className="flex items-start gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <div className="flex-1 space-y-1.5">
                          <input
                            type="text"
                            placeholder="Nome do aluno..."
                            value={item.nome}
                            onChange={e => handleUpdateAlunoAtencao(idx, 'nome', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 font-semibold"
                          />
                          <input
                            type="text"
                            placeholder="Motivo (ex: dificuldade de leitura, não faz lição, etc.)..."
                            value={item.motivo}
                            onChange={e => handleUpdateAlunoAtencao(idx, 'motivo', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-600"
                          />
                        </div>

                        {formPreConselho.alunosAtencao.length > 1 && (
                          <button
                            type="button"
                            onClick={() => handleRemoveAlunoAtencao(idx)}
                            className="text-slate-400 hover:text-red-500 p-1.5"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Pergunta 6: Alunos Destaques */}
                <div className="space-y-3 pt-4 border-t border-slate-100">
                  <div className="flex items-center justify-between">
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs">6</span>
                        Alunos com Destaques Positivos / Liderança
                      </h4>
                      <p className="text-xs text-slate-500 mt-0.5">Valorize os alunos que demonstraram excelente superação, cooperação ou dedicação.</p>
                    </div>

                    <button
                      type="button"
                      onClick={handleAddAlunoDestaque}
                      className="px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-semibold flex items-center gap-1.5 transition-all border border-emerald-200"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                      Adicionar Destaque
                    </button>
                  </div>

                  <div className="space-y-2">
                    {formPreConselho.alunosDestaque.map((item, idx) => (
                      <div key={idx} className="flex items-start gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <div className="flex-1 space-y-1.5">
                          <input
                            type="text"
                            placeholder="Nome do aluno destaque..."
                            value={item.nome}
                            onChange={e => handleUpdateAlunoDestaque(idx, 'nome', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 font-semibold"
                          />
                          <input
                            type="text"
                            placeholder="Motivo do elogio / reconhecimento..."
                            value={item.motivo}
                            onChange={e => handleUpdateAlunoDestaque(idx, 'motivo', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-600"
                          />
                        </div>

                        {formPreConselho.alunosDestaque.length > 1 && (
                          <button
                            type="button"
                            onClick={() => handleRemoveAlunoDestaque(idx)}
                            className="text-slate-400 hover:text-red-500 p-1.5"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Pergunta 7: Intervenções Docentes */}
                <div className="space-y-2 pt-4 border-t border-slate-100">
                  <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">7</span>
                    Ações de Recuperação e Intervenção Pedagógica Realizadas
                  </h4>
                  <textarea
                    rows={3}
                    value={formPreConselho.intervencoesRealizadas}
                    onChange={e => setFormPreConselho({ ...formPreConselho, intervencoesRealizadas: e.target.value })}
                    placeholder="Quais estratégias você aplicou para auxiliar os alunos com dificuldades? (Ex: nova oportunidade avaliativa, tutoria, lista diferenciada...)"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                {/* Pergunta 8: Parecer Síntese */}
                <div className="space-y-2 pt-4 border-t border-slate-100">
                  <h4 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">8</span>
                    Parecer Síntese Conclusivo para a Reunião de Conselho de Classe
                  </h4>
                  <textarea
                    rows={3}
                    value={formPreConselho.parecerConclusivo}
                    onChange={e => setFormPreConselho({ ...formPreConselho, parecerConclusivo: e.target.value })}
                    placeholder="Resuma sua visão geral pedagógica para esta turma, sugestões para a coordenação ou combinados para o próximo período..."
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                {/* Mensagem de confirmação */}
                {msgSalvo && (
                  <div className="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-sm font-semibold flex items-center gap-2">
                    <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                    <span>{msgSalvo}</span>
                  </div>
                )}

                {/* Botões de Ação */}
                <div className="pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => handleSalvarRelatorio('RASCUNHO')}
                    className="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-xs transition-all"
                  >
                    Salvar como Rascunho
                  </button>

                  <button
                    type="button"
                    onClick={() => handleSalvarRelatorio('ENVIADO')}
                    className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md shadow-emerald-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                  >
                    <Icon name="check" className="w-4 h-4" />
                    <span>Concluir e Enviar para a Diretoria</span>
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Renderizar na raiz
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
