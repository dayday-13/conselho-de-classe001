        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>

      return (

    // --- GERENCIADOR DE ESTADO LOCAL (localStorage) ---
    const STORAGE_KEYS = {
      PROFESSORES: 'conselho_professores_v1',
      RELATORIOS: 'conselho_relatorios_v1',
      TURMAS: 'conselho_turmas_v1'
    };

    function loadInitial(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        console.error('Erro ao salvar no storage', e);
      }
    }

    // --- APLICAÇÃO PRINCIPAL ---
    function App() {
      // Dados
      const [turmas] = useState(() => loadInitial(STORAGE_KEYS.TURMAS, TURMAS_INICIAIS));
      const [professores, setProfessores] = useState(() => loadInitial(STORAGE_KEYS.PROFESSORES, PROFESSORES_INICIAIS));
      const [relatorios, setRelatorios] = useState(() => loadInitial(STORAGE_KEYS.RELATORIOS, RELATORIOS_INICIAIS));

      // Sessão Atual
      // perfil: 'PORTAL' | 'DIRETORA' | 'PROFESSOR'
      const [perfilAtivo, setPerfilAtivo] = useState('PORTAL');
      const [professorSelecionado, setProfessorSelecionado] = useState(null);

      // Diretora - Abas: 'relatorios' | 'professores'
      const [abaDiretora, setAbaDiretora] = useState('relatorios');
      const [filtroTurma, setFiltroTurma] = useState('TODAS');
      const [filtroStatus, setFiltroStatus] = useState('TODOS');
      const [relatorioModal, setRelatorioModal] = useState(null);

      // Cadastro de Novo Professor
      const [novoProf, setNovoProf] = useState({
        nome: '',
        email: '',
        disciplina: 'Matemática',
        turmasIds: []
      });
      const [sucessoCadastro, setSucessoCadastro] = useState(false);

      // Professor - Turma Selecionada para Preenchimento
      const [turmaDocenteId, setTurmaDocenteId] = useState('');
      
      // Questionário de Pré-Conselho
      const [formPreConselho, setFormPreConselho] = useState({
        bimestre: '1º Bimestre',
        aproveitamento: 'BOM',
        percentualAtingido: 75,
        dificuldadesDiagnosticadas: '',
        comportamento: '',
        assiduidade: '',
        intervencoesRealizadas: '',
        parecerConclusivo: '',
        alunosAtencao: [{ nome: '', motivo: '' }],
        alunosDestaque: [{ nome: '', motivo: '' }]
      });
      const [msgSalvo, setMsgSalvo] = useState('');

      // Sincronizar storage sempre que mudar
      useEffect(() => {
        saveStorage(STORAGE_KEYS.PROFESSORES, professores);
      }, [professores]);

      useEffect(() => {
        saveStorage(STORAGE_KEYS.RELATORIOS, relatorios);
      }, [relatorios]);

      // Turmas que o professor atual leciona
      const turmasDoProfessor = useMemo(() => {
        if (!professorSelecionado) return [];
        return turmas.filter(t => (professorSelecionado.turmasIds || []).includes(t.id));
      }, [professorSelecionado, turmas]);

      // Ao trocar de turma no painel do professor, carregar relatório existente se houver
      useEffect(() => {
        if (perfilAtivo === 'PROFESSOR' && professorSelecionado && turmaDocenteId) {
          const existente = relatorios.find(r => r.turmaId === turmaDocenteId && r.professorId === professorSelecionado.id);
          if (existente) {
            setFormPreConselho({
              bimestre: existente.bimestre || '1º Bimestre',
              aproveitamento: existente.aproveitamento || 'BOM',
              percentualAtingido: existente.percentualAtingido || 75,
              dificuldadesDiagnosticadas: existente.dificuldadesDiagnosticadas || '',
              comportamento: existente.comportamento || '',
              assiduidade: existente.assiduidade || '',
              intervencoesRealizadas: existente.intervencoesRealizadas || '',
              parecerConclusivo: existente.parecerConclusivo || '',
              alunosAtencao: existente.alunosAtencao && existente.alunosAtencao.length ? existente.alunosAtencao : [{ nome: '', motivo: '' }],
              alunosDestaque: existente.alunosDestaque && existente.alunosDestaque.length ? existente.alunosDestaque : [{ nome: '', motivo: '' }]
            });
          } else {
            setFormPreConselho({
              bimestre: '1º Bimestre',
              aproveitamento: 'BOM',
              percentualAtingido: 75,
              dificuldadesDiagnosticadas: '',
              comportamento: '',
              assiduidade: '',
              intervencoesRealizadas: '',
              parecerConclusivo: '',
              alunosAtencao: [{ nome: '', motivo: '' }],
              alunosDestaque: [{ nome: '', motivo: '' }]
            });
          }
        }
      }, [turmaDocenteId, professorSelecionado, perfilAtivo]);

      // Entrar como Diretora
      const handleEntrarDiretora = () => {
        setPerfilAtivo('DIRETORA');
        setAbaDiretora('relatorios');
      };

      // Entrar como Professor
      const handleEntrarProfessor = (prof) => {
        setProfessorSelecionado(prof);
        setPerfilAtivo('PROFESSOR');
        const turmasProf = turmas.filter(t => (prof.turmasIds || []).includes(t.id));
        if (turmasProf.length > 0) {
          setTurmaDocenteId(turmasProf[0].id);
        } else {
          setTurmaDocenteId('');
        }
      };

      // Sair / Trocar Acesso
      const handleSair = () => {
        setPerfilAtivo('PORTAL');
        setProfessorSelecionado(null);
        setRelatorioModal(null);
      };

      // Adicionar novo professor
      const handleCadastrarProfessor = (e) => {
        e.preventDefault();
        if (!novoProf.nome.trim()) return;

        const novo = {
          id: 'prof-' + Date.now(),
          nome: novoProf.nome,
          email: novoProf.email || `${novoProf.nome.toLowerCase().replace(/\s+/g, '.')}@escola.edu.br`,
          disciplina: novoProf.disciplina,
          turmasIds: novoProf.turmasIds
        };

        setProfessores([...professores, novo]);
        setNovoProf({
          nome: '',
          email: '',
          disciplina: 'Matemática',
          turmasIds: []
        });
        setSucessoCadastro(true);
        setTimeout(() => setSucessoCadastro(false), 4000);
      };

      // Toggle turma no cadastro de professor
      const handleToggleTurmaCadastro = (tId) => {
        setNovoProf(prev => {
          const jaTem = prev.turmasIds.includes(tId);
          return {
            ...prev,
            turmasIds: jaTem ? prev.turmasIds.filter(id => id !== tId) : [...prev.turmasIds, tId]
          };
        });
      };

      // Remover professor
      const handleRemoverProfessor = (id) => {
        if (confirm('Deseja realmente remover este professor do sistema?')) {
          setProfessores(professores.filter(p => p.id !== id));
        }
      };

      // Salvar ou Enviar Relatório do Professor
      const handleSalvarRelatorio = (statusDesejado = 'ENVIADO') => {
        if (!turmaDocenteId) {
          alert('Selecione uma turma antes de salvar.');
          return;
        }

        const turmaObj = turmas.find(t => t.id === turmaDocenteId);
        const novoRel = {
          id: `rel-${professorSelecionado.id}-${turmaDocenteId}`,
          turmaId: turmaDocenteId,
          turmaNome: turmaObj ? turmaObj.nome : 'Turma',
          disciplina: professorSelecionado.disciplina,
          professorId: professorSelecionado.id,
          professorNome: professorSelecionado.nome,
          bimestre: formPreConselho.bimestre,
          dataEntrega: new Date().toISOString().split('T')[0],
          status: statusDesejado,
          aproveitamento: formPreConselho.aproveitamento,
          percentualAtingido: Number(formPreConselho.percentualAtingido) || 0,
          alunosAtencao: formPreConselho.alunosAtencao.filter(a => a.nome.trim() !== ''),
          alunosDestaque: formPreConselho.alunosDestaque.filter(a => a.nome.trim() !== ''),
          dificuldadesDiagnosticadas: formPreConselho.dificuldadesDiagnosticadas,
          comportamento: formPreConselho.comportamento,
          assiduidade: formPreConselho.assiduidade,
          intervencoesRealizadas: formPreConselho.intervencoesRealizadas,
          parecerConclusivo: formPreConselho.parecerConclusivo
        };

        // Atualizar lista de relatórios
        setRelatorios(prev => {
          const index = prev.findIndex(r => r.turmaId === turmaDocenteId && r.professorId === professorSelecionado.id);
          if (index >= 0) {
            const copia = [...prev];
            copia[index] = novoRel;
            return copia;
          } else {
            return [novoRel, ...prev];
          }
        });

        setMsgSalvo(statusDesejado === 'ENVIADO' ? '✅ Ficha enviada com sucesso para a Diretoria!' : '💾 Rascunho salvo no seu navegador!');
        setTimeout(() => setMsgSalvo(''), 4000);
      };

      // Manipular Aluno em Atenção / Destaque
      const handleAddAlunoAtencao = () => {
        setFormPreConselho(prev => ({
          ...prev,
          alunosAtencao: [...prev.alunosAtencao, { nome: '', motivo: '' }]
        }));
      };

      const handleUpdateAlunoAtencao = (index, field, value) => {
        setFormPreConselho(prev => {
          const copia = [...prev.alunosAtencao];
          copia[index] = { ...copia[index], [field]: value };
          return { ...prev, alunosAtencao: copia };
        });
      };

      const handleRemoveAlunoAtencao = (index) => {
        setFormPreConselho(prev => ({
          ...prev,
          alunosAtencao: prev.alunosAtencao.filter((_, i) => i !== index)
        }));
      };

      const handleAddAlunoDestaque = () => {
        setFormPreConselho(prev => ({
          ...prev,
          alunosDestaque: [...prev.alunosDestaque, { nome: '', motivo: '' }]
        }));
      };

      const handleUpdateAlunoDestaque = (index, field, value) => {
        setFormPreConselho(prev => {
          const copia = [...prev.alunosDestaque];
          copia[index] = { ...copia[index], [field]: value };
          return { ...prev, alunosDestaque: copia };
        });
      };

      const handleRemoveAlunoDestaque = (index) => {
        setFormPreConselho(prev => ({
          ...prev,
          alunosDestaque: prev.alunosDestaque.filter((_, i) => i !== index)
        }));
      };

      // Relatórios filtrados para a Diretora

                    onClick={() => handleSalvarRelatorio('RASCUNHO')}
                    className="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-xs transition-all"
                  >
                    Salvar como Rascunho
                  </button>

                  <button
                    type="button"
                    onClick={() => handleSalvarRelatorio('ENVIADO')}
                    className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md shadow-emerald-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                  >
                    <Icon name="check" className="w-4 h-4" />
                    <span>Concluir e Enviar para a Diretoria</span>
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Renderizar na raiz
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
