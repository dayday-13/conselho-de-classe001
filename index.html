                          {alunos.filter(a => a.turmaId === selectedTurmaId).map(aluno => (
                            <tr key={aluno.id} className="hover:bg-slate-50 transition-colors">
                              <td className="p-3 text-slate-500 font-mono">{aluno.matricula}</td>
                              <td className="p-3 font-bold text-slate-900">{aluno.nome}</td>
                              <td className="p-3 text-center">
                                <input
                                  type="number"
                                  step="0.1"
                                  min="0"
                                  max="10"
                                  defaultValue={aluno.media}
                                  onBlur={(e) => handleUpdateAlunoNota(aluno.id, e.target.value, aluno.frequencia)}
                                  className={`w-16 text-center font-bold px-2 py-1 rounded-lg border text-xs ${
                                    aluno.media < 5 ? 'bg-red-50 text-red-800 border-red-200' : 'bg-slate-50 text-slate-800 border-slate-300'
                                  }`}
                                />
                              </td>
                              <td className="p-3 text-center">
                                <input
                                  type="number"
                                  min="0"
                                  max="100"
                                  defaultValue={aluno.frequencia}
                                  onBlur={(e) => handleUpdateAlunoNota(aluno.id, aluno.media, e.target.value)}
                                  className={`w-16 text-center font-bold px-2 py-1 rounded-lg border text-xs ${
                                    aluno.frequencia < 75 ? 'bg-red-50 text-red-800 border-red-200' : 'bg-slate-50 text-slate-800 border-slate-300'
                                  }`}
                                />
                              </td>
                              <td className="p-3 text-center">
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                  aluno.emAcompanhamento ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'
                                }`}>
                                  {aluno.emAcompanhamento ? 'Atenção' : 'Regular'}
                                </span>
                              </td>
                              <td className="p-3 text-right">
                                <button
                                  onClick={() => setSelectedAlunoModal(aluno)}
                                  className="text-xs font-bold text-blue-600 hover:underline"
                                >
                                  Ver Ficha
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ABA 5: ALUNOS & HISTÓRICO */}
              {activeTab === 'alunos' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-2xs">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                      <div>
                        <h2 className="text-xl font-black text-slate-900 tracking-tight">
                          Histórico e Acompanhamento Discente
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Prontuário pedagógico individual de cada estudante da unidade escolar
                        </p>
                      </div>

                      <div className="flex items-center gap-2 flex-wrap">
                        <input
                          type="text"
                          placeholder="Buscar por nome..."
                          value={searchAluno}
                          onChange={(e) => setSearchAluno(e.target.value)}
                          className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium w-48"
                        />
                        <button
                          onClick={() => setFilterApenasAtencao(!filterApenasAtencao)}
                          className={`px-3 py-2 rounded-xl text-xs font-bold border transition-colors ${
                            filterApenasAtencao ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-300'
                          }`}
                        >
                          {filterApenasAtencao ? 'Apenas Atenção (Ativo)' : 'Filtrar Atenção'}
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-5">
                      {alunos
                        .filter(a => (searchAluno ? a.nome.toLowerCase().includes(searchAluno.toLowerCase()) : true))
                        .filter(a => (filterApenasAtencao ? a.emAcompanhamento : true))
                        .map(aluno => (
                          <div key={aluno.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                            <div className="flex items-start justify-between gap-2">
                              <div>
                                <h4 className="text-xs font-bold text-slate-900">{aluno.nome}</h4>
                                <span className="text-[10px] text-slate-500">Matrícula: {aluno.matricula}</span>
                              </div>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                aluno.emAcompanhamento ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'
                              }`}>
                                {aluno.emAcompanhamento ? 'Atenção' : 'Regular'}
                              </span>
                            </div>

                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <div className="p-2 bg-white rounded-lg border border-slate-100 text-center">
                                <span className="text-[10px] text-slate-400 block">Média</span>
                                <span className="font-black text-slate-800">{aluno.media.toFixed(1)}</span>
                              </div>
                              <div className="p-2 bg-white rounded-lg border border-slate-100 text-center">
                                <span className="text-[10px] text-slate-400 block">Frequência</span>
                                <span className="font-black text-slate-800">{aluno.frequencia}%</span>
                              </div>
                            </div>

                            <p className="text-[11px] text-slate-600 italic line-clamp-2">
                              {aluno.obs}
                            </p>

                            <button
                              onClick={() => setSelectedAlunoModal(aluno)}
                              className="w-full bg-white hover:bg-slate-100 border border-slate-200 text-slate-800 font-bold text-xs py-1.5 rounded-xl transition-colors"
                            >
                              Ver Histórico Completo
                            </button>
                          </div>
                        ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ABA 6: ANÁLISE PEDAGÓGICA (GRÁFICOS SVG) */}
              {activeTab === 'analise' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-2xs">
                    <h2 className="text-xl font-black text-slate-900 tracking-tight">
                      Painel de Análise Pedagógica
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Indicadores de rendimento comparativo por turma, componente curricular e assiduidade
                    </p>
                  </div>

                  {/* Gráficos em SVG */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Gráfico 1: Médias por Turma */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs">
                      <h3 className="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <Icon name="TrendingUp" className="w-4 h-4 text-blue-600" />
                        Médias Comparativas por Turma
                      </h3>

                      <div className="space-y-3">
                        {[
                          { turma: '6º Ano A', media: 7.8, cor: 'bg-emerald-500' },
                          { turma: '7º Ano A', media: 6.9, cor: 'bg-amber-500' },
                          { turma: '7º Ano B', media: 7.4, cor: 'bg-blue-500' },
                          { turma: '8º Ano A', media: 6.8, cor: 'bg-amber-500' },
                          { turma: '9º Ano A', media: 7.3, cor: 'bg-blue-500' }
                        ].map((item, idx) => (
                          <div key={idx} className="space-y-1">
                            <div className="flex justify-between text-xs font-bold">
                              <span className="text-slate-700">{item.turma}</span>
                              <span className="text-slate-900">{item.media.toFixed(1)} / 10.0</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                              <div
                                className={`${item.cor} h-3 rounded-full transition-all duration-500`}
                                style={{ width: `${item.media * 10}%` }}
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Gráfico 2: Distribuição de Rendimento */}
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs">
                      <h3 className="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <Icon name="PieChart" className="w-4 h-4 text-indigo-600" />
                        Distribuição do Rendimento Escolar
                      </h3>

                      <div className="grid grid-cols-3 gap-3 text-center my-4">
                        <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                          <span className="text-xl font-black text-emerald-700">68%</span>
                          <span className="text-[10px] font-bold text-emerald-800 block mt-1">Acima de 7.0</span>
                        </div>
                        <div className="p-3 bg-amber-50 rounded-xl border border-amber-100">
                          <span className="text-xl font-black text-amber-700">22%</span>
                          <span className="text-[10px] font-bold text-amber-800 block mt-1">Entre 5.0 e 6.9</span>
                        </div>
                        <div className="p-3 bg-red-50 rounded-xl border border-red-100">
                          <span className="text-xl font-black text-red-700">10%</span>
                          <span className="text-[10px] font-bold text-red-800 block mt-1">Abaixo de 5.0</span>
                        </div>
                      </div>

                      <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <strong>Diagnóstico Geral:</strong> 90% dos estudantes encontram-se dentro ou acima da média de aprovação estabelecida pelo regimento escolar (5.0), com foco prioritário de reforço nos 10% em defasagem.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {/* ABA 7: CORPO DOCENTE */}
              {activeTab === 'professores' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-2xs">
                    <h2 className="text-xl font-black text-slate-900 tracking-tight">
                      Quadro de Professores & Atribuições
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Acompanhamento das disciplinas, turmas atendidas e status de envio de pré-conselho
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {USUARIOS_BASE.filter(u => u.perfil === 'PROFESSOR').map(prof => {
                      const relatoriosProf = relatorios.filter(r => r.professorId === prof.id);
                      return (
                        <div key={prof.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-2xs space-y-3">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-800 font-bold flex items-center justify-center text-sm">
                              {prof.nome.charAt(0)}
                            </div>
                            <div>
                              <h4 className="text-xs font-bold text-slate-900">{prof.nome}</h4>
                              <p className="text-[10px] text-slate-500">{prof.email}</p>
                            </div>
                          </div>

                          <div className="text-xs text-slate-600 space-y-1">
                            <p><strong className="text-slate-800">Turmas:</strong> {prof.turmas?.map(tid => turmas.find(t => t.id === tid)?.nome).join(', ') || 'Todas'}</p>
                            <p><strong className="text-slate-800">Fichas Entregues:</strong> {relatoriosProf.length} de {prof.turmas?.length || 3}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* MODAL: VISUALIZAR RELATÓRIO OFICIAL (IMPRESSÃO / PDF) */}
          {previewReport && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl animate-fadeIn space-y-6">
                <div className="flex items-center justify-between border-b border-slate-200 pb-4 no-print">
                  <div className="flex items-center gap-2 text-xs font-bold text-slate-600">
                    <Icon name="FileText" className="w-4 h-4 text-emerald-600" />
                    <span>Visualização da Ficha de Pré-Conselho</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5"
                    >
                      <Icon name="Printer" className="w-4 h-4" />
                      Imprimir / Salvar PDF
                    </button>
                    <button
                      onClick={() => setPreviewReport(null)}
                      className="text-slate-400 hover:text-slate-600 p-1"
                    >
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* CABEÇALHO OFICIAL DO DOCUMENTO */}
                <div className="border-b-2 border-slate-900 pb-4 text-center">
                  <p className="text-[11px] font-bold text-slate-600 tracking-widest uppercase">Secretaria de Estado da Educação</p>
                  <h3 className="text-sm font-black text-slate-900 mt-1 uppercase">{ESCOLA_NOME}</h3>
                  <p className="text-xs text-slate-600">{ESCOLA_MODALIDADE} • ANO LETIVO {previewReport.anoLetivo || ANO_LETIVO_PADRAO}</p>
                  <h2 className="text-base font-black text-slate-900 mt-3 border-t border-slate-200 pt-2 tracking-wide">
                    FICHA INDIVIDUAL DE PRÉ-CONSELHO PEDAGÓGICO
                  </h2>
                </div>

                {/* DADOS DE IDENTIFICAÇÃO */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl text-xs">
                  <div>
                    <span className="text-slate-500 block text-[10px]">Turma</span>
                    <strong className="text-slate-900">{previewReport.turmaNome}</strong>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">Disciplina</span>
                    <strong className="text-slate-900">{previewReport.disciplinaNome}</strong>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">Professor(a)</span>
                    <strong className="text-slate-900">{previewReport.professorNome}</strong>
                  </div>
                  <div>
                    <span className="text-slate-500 block text-[10px]">Período</span>
                    <strong className="text-slate-900">{previewReport.periodo}</strong>
                  </div>
                </div>

                {/* CORPO DO DOCUMENTO */}
                <div className="space-y-4 text-xs">
                  <div className="p-3.5 bg-white border border-slate-200 rounded-xl">
                    <strong className="text-slate-900 block mb-1 uppercase text-[11px]">1. Desenvolvimento da Turma:</strong>
                    <p className="text-slate-700 leading-relaxed">{previewReport.respostas?.desenvolvimentoGeral || 'Não informado.'}</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="p-3.5 bg-red-50/60 border border-red-200 rounded-xl">
                      <strong className="text-red-950 block mb-1 uppercase text-[11px]">2. Estudantes em Atenção / Dificuldades:</strong>
                      <p className="text-slate-800 leading-relaxed">{previewReport.respostas?.alunosDificuldade || 'Nenhum estudante apontado.'}</p>
                    </div>

                    <div className="p-3.5 bg-emerald-50/60 border border-emerald-200 rounded-xl">
                      <strong className="text-emerald-950 block mb-1 uppercase text-[11px]">3. Estudantes em Destaque:</strong>
                      <p className="text-slate-800 leading-relaxed">{previewReport.respostas?.alunosDestaque || 'Nenhum estudante apontado.'}</p>
                    </div>
                  </div>

                  <div className="p-3.5 bg-white border border-slate-200 rounded-xl">
                    <strong className="text-slate-900 block mb-1 uppercase text-[11px]">4. Fatores Intervenientes (Frequência & Comportamento):</strong>
                    <p className="text-slate-700 leading-relaxed">{previewReport.respostas?.fatoresAssiduidade || 'Sem registros complementares.'}</p>
                  </div>

                  <div className="p-3.5 bg-white border border-slate-200 rounded-xl">
                    <strong className="text-slate-900 block mb-1 uppercase text-[11px]">5. Ações Pedagógicas e Encaminhamentos:</strong>
                    <p className="text-slate-700 leading-relaxed">{previewReport.respostas?.acoesPedagogicas || 'Recuperação contínua regular.'}</p>
                  </div>

                  <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
                    <strong className="text-slate-900 block mb-1 uppercase text-[11px]">6. Parecer Síntese do Docente:</strong>
                    <p className="text-slate-800 font-medium leading-relaxed">{previewReport.respostas?.sinteseGeral || 'Homologado sem ressalvas.'}</p>
                  </div>
                </div>

                {/* ASSINATURA */}
                <div className="pt-8 grid grid-cols-2 gap-8 text-center text-xs">
                  <div>
                    <div className="border-t border-slate-400 w-48 mx-auto mb-1"></div>
                    <span className="font-bold text-slate-800">{previewReport.professorNome}</span>
                    <span className="block text-[10px] text-slate-500">Professor(a) Titular</span>
                  </div>
                  <div>
                    <div className="border-t border-slate-400 w-48 mx-auto mb-1"></div>
                    <span className="font-bold text-slate-800">Coordenação Pedagógica</span>
                    <span className="block text-[10px] text-slate-500">Visto do Conselho</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FICHA DETALHADA DO ALUNO */}
          {selectedAlunoModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl animate-fadeIn space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-black text-slate-900">{selectedAlunoModal.nome}</h3>
                    <span className="text-xs text-slate-500">Matrícula: {selectedAlunoModal.matricula}</span>
                  </div>
                  <button onClick={() => setSelectedAlunoModal(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl">
                    <span className="text-slate-500 block text-[10px]">Média Geral</span>
                    <strong className="text-base font-black text-slate-900">{selectedAlunoModal.media.toFixed(1)}</strong>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl">
                    <span className="text-slate-500 block text-[10px]">Assiduidade</span>
                    <strong className="text-base font-black text-slate-900">{selectedAlunoModal.frequencia}%</strong>
                  </div>
                </div>

                <div className="text-xs text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <strong className="block text-slate-900 mb-1">Anotações do Conselho de Classe:</strong>
                  <p className="leading-relaxed">{selectedAlunoModal.obs}</p>
                </div>

                <button
                  onClick={() => setSelectedAlunoModal(null)}
                  className="w-full bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl shadow-xs"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          {/* RODAPÉ */}
          <footer className="bg-white border-t border-slate-200 py-4 mt-auto text-center text-xs text-slate-500 no-print">
            <p>
              {ESCOLA_NOME} • Sistema Autônomo de Pré-Conselho e Conselho de Classe ({ANO_LETIVO_PADRAO})
            </p>
          </footer>
        </div>
      );
    }

    // RENDERIZAR NA RAIZ DO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
